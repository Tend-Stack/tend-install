name: Sign and publish the install channels

# Source of truth: deploy/tend-install/ in the panel repository
# (docs/agent/installer.md, "Publishing a release"). Replace this file from
# there; do not edit it here.
#
# Every 15 minutes:
#   copy  copies a release and its proof from the private panel image package
#         to the public one, proof first, and only when the proof verifies. It
#         uses this repository's own GITHUB_TOKEN (packages: write) and never
#         sees the release key.
#   plan  reads the public package anonymously, verifies each new version's
#         proof, and lists what to sign (new versions, and manifests older than
#         seven days; they live thirty). Nothing to do ends the run here.
#   sign  verifies the proof again, signs with TEND_PANEL_RELEASE_KEY, and
#         pushes site/ with the deploy key. It names the environment `release`
#         (branch `main` only), which alone holds both secrets. It works with
#         the required reviewer present (the run then waits, as during the
#         cutover) and without it.
#   alert opens one GitHub issue per refusal or failure (never a comment).
#
# No human approves a run. The operator's SSH-signed vX.Y.Z tag is the
# approval: a version is copied and signed only with the proof release.yml
# pushed (signed tag object checked against release-tag-signers, a Sigstore
# certificate for wilkinsantana/tend.host's release.yml run on that tag, the
# statement {version, revision, image digest} equal to the image). See
# scripts/tend-install.sh and docs/strategy/auto-channel-signing-plan.md.
# A refused release or a failed copy never blocks the re-sign of what is
# published.
#
# After a publish that changed site/, the sign job asks the SaaS repository (Gitea
# Rubirosa/tend-host-saas) to vendor it at once instead of waiting for its hourly
# cron (secret SAAS_PIN_BUMP_TOKEN; absent means a notice and no dispatch).
# A run that was queued behind the release approval and finds main moved on
# stops cleanly: it never signs from a stale plan and never fails at push.
#
# Manual run with dry_run: no copy; plans and signs with a throwaway key
# generated in the run, verifies the result exactly as install.sh would,
# publishes nothing, and never touches the release environment.

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and sign with a throwaway key; copy and publish nothing"
        type: boolean
        default: false
      force_resign:
        description: "Re-sign both channels now even if they are not due"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-install-channels
  cancel-in-progress: false

jobs:
  copy:
    name: Copy proven releases to the public package
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # The environment holds TEND_PRIVATE_PACKAGES_READ only when the package grant
    # for GITHUB_TOKEN could not be made (plan, D5); without that secret the
    # token is used for both registries.
    environment: image-copy
    permissions:
      contents: read
      packages: write
    outputs:
      refused: ${{ steps.copy.outputs.refused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.2.3
      - name: Copy
        id: copy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READ_TOKEN: ${{ secrets.TEND_PRIVATE_PACKAGES_READ }}
        run: |
          set -euo pipefail
          umask 077
          # Docker config files; tokens are shell variables here, never arguments.
          docker_config() { printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$1" "$2" | base64 -w0)"; }
          docker_config "$GITHUB_ACTOR" "$GITHUB_TOKEN" > "$RUNNER_TEMP/to.json"
          if [ -n "${READ_TOKEN:-}" ]; then
            docker_config wilkinsantana "$READ_TOKEN" > "$RUNNER_TEMP/from.json"
          else
            docker_config "$GITHUB_ACTOR" "$GITHUB_TOKEN" > "$RUNNER_TEMP/from.json"
          fi
          export TEND_COPY_TO_CONFIG="$RUNNER_TEMP/to.json" TEND_COPY_FROM_CONFIG="$RUNNER_TEMP/from.json"
          unset GITHUB_TOKEN READ_TOKEN
          rc=0
          scripts/tend-install.sh copy --out "$RUNNER_TEMP/copy" 2>&1 | tee "$RUNNER_TEMP/copy.log" || rc=$?
          rm -f "$RUNNER_TEMP/to.json" "$RUNNER_TEMP/from.json"
          if [ -s "$RUNNER_TEMP/copy/copy-refusals.tsv" ]; then echo "refused=1" >> "$GITHUB_OUTPUT"; else echo "refused=0" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Image copy"
            echo '```'
            cat "$RUNNER_TEMP/copy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: copy
          path: ${{ runner.temp }}/copy/copy-refusals.tsv
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: Plan
    needs: copy
    # A copy that refused or failed never blocks a re-sign.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      sign: ${{ steps.plan.outputs.sign }}
      refused: ${{ steps.plan.outputs.refused }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1
      - name: Plan from the public package
        id: plan
        env:
          FORCE: ${{ (inputs.force_resign || inputs.dry_run) && '--force-resign' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scripts/tend-install.sh plan --site site --out "$RUNNER_TEMP/plan" $FORCE 2>&1 | tee "$RUNNER_TEMP/plan.log"
          sign="$(sed -n 's/^sign=//p' "$RUNNER_TEMP/plan/plan.env")"
          refused="$(sed -n 's/^refused=//p' "$RUNNER_TEMP/plan/plan.env")"
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          {
            echo "### Install channel plan"
            echo '```'
            cat "$RUNNER_TEMP/plan.log"
            echo '```'
            if [ "$refused" = 1 ]; then echo "A release was refused: the alert job opens an issue."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan
          retention-days: 7

  sign:
    name: Sign and publish
    needs: plan
    # !cancelled(): plan's own upstream (copy) may be skipped or failed; a broken copy
    # must never block a re-sign, so judge only plan's result here.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.sign == '1' && !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      # The deploy key is what may push to main past the ruleset (a raw push with any
      # other credential is refused). Until the cutover the secret is unset and the
      # checkout uses the workflow token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ssh-key: ${{ secrets.TEND_INSTALL_DEPLOY_KEY }}
      # A scheduled run is queued behind the `release` approval; when it is finally
      # approved, a newer run may already have published, and this run's plan (made
      # from the commit it was queued at) is stale. Signing and pushing it would be
      # rejected ("fetch first") or, worse, re-sign over newer work. Stop cleanly
      # instead: the next scheduled run plans again from the current main.
      - name: Stop if main moved since this run was queued
        id: fresh
        run: |
          set -euo pipefail
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::main moved on ($(git rev-parse --short HEAD) -> $(git rev-parse --short FETCH_HEAD)) while this run waited; skipping it. The next scheduled run plans from the current main."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.fresh.outputs.stale == '0'
        with:
          cosign-release: v2.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.fresh.outputs.stale == '0'
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Sign the channel manifests and install.sh
        if: steps.fresh.outputs.stale == '0'
        env:
          TEND_PANEL_RELEASE_KEY: ${{ secrets.TEND_PANEL_RELEASE_KEY }}
        run: scripts/tend-install.sh sign --site site --plan "$RUNNER_TEMP/plan"
      - name: Commit site/ and refresh the releases
        id: publish
        if: steps.fresh.outputs.stale == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          scripts/tend-install.sh publish --site site --plan "$RUNNER_TEMP/plan"
          # Changed means: a commit was made and it reached main (a push lost to a
          # newer run exits above without publishing, and is not "changed").
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$before" ] && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
      # Instant path: ask the SaaS repository to vendor the new site/ now rather
      # than at its next hourly cron (:41). Best effort by design: a missing
      # secret or a failed call is a notice, never a failed publish; the cron is
      # the fallback.
      - name: Trigger the SaaS install pin bump
        if: steps.publish.outputs.changed == '1'
        env:
          SAAS_PIN_BUMP_TOKEN: ${{ secrets.SAAS_PIN_BUMP_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SAAS_PIN_BUMP_TOKEN:-}" ]; then
            echo "::notice::SAAS_PIN_BUMP_TOKEN is not set; the SaaS pin bump runs at its next hourly cron (:41)."
            exit 0
          fi
          url="https://j.santanafam.com/api/v1/repos/Rubirosa/tend-host-saas/actions/workflows/install-pin-bump.yml/dispatches"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: token ${SAAS_PIN_BUMP_TOKEN}" -H 'Content-Type: application/json' \
            -d '{"ref":"main"}' "$url" 2> /dev/null || true)"
          case "$code" in
            2??) echo "SaaS install-pin-bump dispatched (HTTP $code)." ;;
            *) echo "::notice::SaaS install-pin-bump dispatch did not succeed (HTTP ${code:-none}); the hourly cron will pick the release up." ;;
          esac

  alert:
    name: Open issues for refusals and failures
    needs: [copy, plan, sign]
    if: >-
      always() && !inputs.dry_run && github.ref == 'refs/heads/main' &&
      (needs.copy.outputs.refused == '1' || needs.plan.outputs.refused == '1' ||
      needs.copy.result == 'failure' || needs.plan.result == 'failure' || needs.sign.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A failed job uploads nothing; the alert then has only the failure to report.
      # Both artifacts land in one directory: refusals.tsv (plan) and copy-refusals.tsv (copy).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: copy
          path: ${{ runner.temp }}/plan
      - name: Open the issues (one per title; no comments)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COPY_RESULT: ${{ needs.copy.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
        run: |
          set -euo pipefail
          failed=""
          for r in "$COPY_RESULT" "$PLAN_RESULT" "$SIGN_RESULT"; do
            if [ "$r" = failure ]; then failed="--failed"; fi
          done
          # shellcheck disable=SC2086
          scripts/tend-install.sh alert --plan "$RUNNER_TEMP/plan" $failed

  dry_run:
    name: Dry run (throwaway key)
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Sign with a throwaway key and verify as stage 0 would
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/throwaway.key"
          TEND_INSTALL_DRY_RUN_SPKI="$(openssl pkey -in "$RUNNER_TEMP/throwaway.key" -pubout -outform DER | base64 -w0)"
          TEND_PANEL_RELEASE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")"
          export TEND_INSTALL_DRY_RUN_SPKI TEND_PANEL_RELEASE_KEY
          cp -r site "$RUNNER_TEMP/site" 2> /dev/null || mkdir -p "$RUNNER_TEMP/site"
          scripts/tend-install.sh sign --site "$RUNNER_TEMP/site" --plan "$RUNNER_TEMP/plan"
          ls -l "$RUNNER_TEMP/site" "$RUNNER_TEMP/site/v1"
